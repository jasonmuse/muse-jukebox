# The Muse Jukebox iPhone app (ios/), built on GitHub's Macs with Xcode 27.1 (the iPhone Duo SDK).
# Every push that touches it is built for the Simulator (no signing needed), so a change that breaks
# the build shows up here. Run it by hand (Actions › iPhone app › Run workflow) to send a build to
# TestFlight too, once the App Store Connect secrets are set (ios/README.md says how).
name: iPhone app

on:
  push:
    paths:
      - "ios/**"
      - "songs.json"
      - "haptics/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Send the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for the Simulator
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # (the app needs ios/, haptics/ and songs.json, not the site's songs and pictures)
          sparse-checkout: |
            ios
            haptics

      - name: Xcode
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/MuseJukebox.xcodeproj \
            -scheme MuseJukebox \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      # On the newest iPhone the Simulator has (and iPhone Duo, if it has one): the songs, then Now
      # Playing (-showNowPlaying), pictured after 15 seconds each, and still running by then. Each
      # picture's kept, and a small copy's written into the log too (between SHOT-BEGIN and SHOT-END,
      # in base64) for whoever can read the log but not download what's kept.
      - name: Run it in the Simulator, and take pictures
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*/Build/Products/Debug-iphonesimulator/MuseJukebox.app" | head -1)
          # (newest first: iPhone Duo may only run on some of them)
          runtimes=$(xcrun simctl list runtimes --json | python3 -c 'import json, sys; ios = [r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]; print("\n".join(reversed(ios)))')
          echo "App: $app"
          echo "Runtimes:" $runtimes
          xcrun simctl list devicetypes --json | python3 -c '
          import json, re, sys
          names = [kind["name"] for kind in json.load(sys.stdin)["devicetypes"]]
          phones = sorted((name for name in names if re.fullmatch(r"iPhone \d+ Pro", name)), key=lambda name: int(name.split()[1]))
          duos = [name for name in names if "Duo" in name]
          print("\n".join(phones[-1:] + duos[:1]))
          ' > devices.txt
          cat devices.txt
          mkdir -p screenshots
          status=0
          while IFS= read -r device; do
            udid=""
            for runtime in $runtimes; do
              if udid=$(xcrun simctl create "Jukebox" "$device" "$runtime" 2>/dev/null); then
                echo "$device on $runtime"
                break
              fi
              udid=""
            done
            if [ -z "$udid" ]; then
              echo "::notice::None of this Mac's Simulator runtimes runs $device"
              continue
            fi
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            # (the device's own screens: one on an iPhone, two on iPhone Duo, outside and in)
            screens=$(xcrun simctl io "$udid" enumerate 2>/dev/null | python3 -c '
          import re, sys
          screens, screen = [], None
          for line in sys.stdin:
              found = re.match(r"\s+Screen ID: (\d+)", line)
              if found:
                  screen = found.group(1)
              if "Screen Type: Integrated" in line and screen:
                  screens.append(screen)
          print(" ".join(screens or ["1"]))
          ')
            echo "$device screens: $screens"
            xcrun simctl install "$udid" "$app"
            for view in songs now-playing; do
              args=""
              if [ "$view" = now-playing ]; then args="-showNowPlaying"; fi
              if ! xcrun simctl launch --terminate-running-process "$udid" app.muselabs.jukebox $args; then
                echo "::error::Muse Jukebox wouldn't open on $device"
                status=1
                continue
              fi
              sleep 15
              for screen in $screens; do
                name="$device - $view"
                if [ "$screens" != "$screen" ]; then name="$name - screen $screen"; fi
                picture="screenshots/$name.png"
                if ! xcrun simctl io "$udid" screenshot --display="$screen" "$picture"; then
                  echo "::warning::Couldn't take a picture of $name"
                  continue
                fi
                if sips -Z 560 -s format jpeg -s formatOptions 55 "$picture" --out small.jpg > /dev/null; then
                  echo "::group::$name (small copy)"
                  echo "SHOT-BEGIN $name"
                  base64 -i small.jpg | fold -w 800
                  echo "SHOT-END"
                  echo "::endgroup::"
                fi
              done
              if ! xcrun simctl spawn "$udid" launchctl list | grep -q "app.muselabs.jukebox"; then
                echo "::error::Muse Jukebox stopped on $device ($view) within 15 seconds of opening"
                status=1
              fi
            done
            xcrun simctl shutdown "$udid"
          done < devices.txt
          exit $status

      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: What went wrong
        if: failure()
        run: |
          {
            echo "### Build errors"
            echo '```'
            grep -E "error:" build.log | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Send to TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the App Store Connect secrets are set
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret isn't set (ios/README.md, \"Trying it without a Mac\")"
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
            haptics

      - name: Archive
        run: |
          set -o pipefail
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild archive \
            -project ios/MuseJukebox.xcodeproj \
            -scheme MuseJukebox \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/MuseJukebox.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MuseJukebox.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log

      - name: What went wrong
        if: failure()
        run: |
          {
            echo "### Errors"
            echo '```'
            cat archive.log export.log 2>/dev/null | grep -E "error:|Error Domain|failed" | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tidy up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
